<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2C230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stock 2086">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Stock 2086 Turin</title>
<style>
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-display: swap; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-display: swap; src: url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-display: swap; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
*, *::before, *::after { box-sizing: border-box; }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }

/* Layout: app a schermo intero per telefono — barra in alto con il report scelto, contenuto scorrevole, schede in basso.
   Convenzione: bordo pieno = dato del report, bordo tratteggiato = calcolo dell'app. */
:root {
  --bg: #E8ECEB; --surface: #F8FAF9; --sunk: #DDE3E1; --line: #C9D2CF; --ink: #10191C; --muted: #566562;
  --label: #F2C230; --label-ink: #1B1503;
  --calc: #4650C4; --up: #127249; --down: #B9372A; --tk: #A12F78; --nt: #0B7480;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1315; --surface: #151E21; --sunk: #0A0F11; --line: #27353A; --ink: #E4ECEA; --muted: #8C9C99;
  --label: #F2C230; --label-ink: #1B1503;
  --calc: #929AFF; --up: #4DC38B; --down: #FF7B6A; --tk: #E57BC2; --nt: #4FC3CD; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1315; --surface: #151E21; --sunk: #0A0F11; --line: #27353A; --ink: #E4ECEA; --muted: #8C9C99;
  --label: #F2C230; --label-ink: #1B1503;
  --calc: #929AFF; --up: #4DC38B; --down: #FF7B6A; --tk: #E57BC2; --nt: #4FC3CD; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
/* niente zoom con il doppio tocco; campi a 16px così iPhone non ingrandisce la pagina quando li tocchi */
*, *::before, *::after { touch-action: manipulation; }
input, select, textarea { font-size: 16px !important; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--calc); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }

.app { display: flex; flex-direction: column; height: 100%; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 16px; display: flex; align-items: center; gap: 10px; }
.brandmark { display: flex; align-items: baseline; gap: 6px; flex: 0 0 auto; }
.brandmark b { font-family: var(--f-display); font-size: 22px; letter-spacing: .02em; line-height: 1; }
.brandmark span { font-family: var(--f-mono); font-size: 11px; background: var(--label); color: var(--label-ink); padding: 2px 5px; border-radius: 3px; }
.top select { flex: 1 1 auto; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
main { flex: 1 1 auto; overflow-y: auto; padding-inline: 16px; padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 14px; max-width: 760px; margin-inline: auto; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: none; border: 0; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 11.5px; font-weight: 500; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"] .ic { background: var(--label); color: var(--label-ink); }
.tabs .ic { display: grid; place-items: center; width: 44px; height: 26px; border-radius: 13px; }

.lede { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.lede h1 { font-family: var(--f-display); font-size: 30px; line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.lede p { margin: 0; color: var(--muted); font-size: 13px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); align-items: center; }
.tag { display: inline-flex; align-items: center; font-family: var(--f-mono); font-size: 9.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; line-height: 1.5; white-space: nowrap; }
.tag.rep { border: 1px solid var(--ink); color: var(--ink); }
.tag.calc { border: 1px dashed var(--calc); color: var(--calc); }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 620px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 11px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi.c { border-style: dashed; border-color: var(--calc); }
.kpi .k { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kpi .v { font-family: var(--f-display); font-size: 27px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); min-height: 1.4em; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 6px; }
.card h2 { font-family: var(--f-display); font-size: 21px; margin: 0; letter-spacing: .02em; text-transform: uppercase; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 12px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: .75; }

.list { display: flex; flex-direction: column; }
.ri { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 12px; }
.ri:active { background: var(--sunk); }
.ri-main { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.code { font-family: var(--f-mono); font-size: 13px; font-weight: 500; word-break: break-all; }
.ri-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ri-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-variant-numeric: tabular-nums; }
.ri-right .big { font-family: var(--f-display); font-size: 21px; line-height: 1; }
.ri-right .small { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.more { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 12px; font-weight: 600; font-size: 13px; text-align: left; color: var(--ink); display: flex; justify-content: space-between; }
.empty { padding: 14px 12px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

.dp { display: inline-flex; align-items: center; border: 1px dashed currentColor; border-radius: 4px; padding: 0 5px; font-family: var(--f-mono); font-size: 12px; line-height: 1.5; white-space: nowrap; }
.dp.up { color: var(--up); } .dp.down { color: var(--down); } .dp.zero { color: var(--muted); }
.pt { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; padding: 1px 5px; border-radius: 3px; border: 1px solid currentColor; }
.pt.FULL { color: var(--muted); } .pt.TK { color: var(--tk); } .pt.NT { color: var(--nt); }
.arrow { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
.search { position: relative; }
.search input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 12px 38px; font-size: 15px; font-family: var(--f-mono); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.filters { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; font-size: 13px; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; font-weight: 600; font-size: 13.5px; }
.btn.primary { background: var(--label); color: var(--label-ink); border-color: var(--label); }
.btn.danger { color: var(--down); border-color: var(--down); background: none; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .5; }

.cmpwrap { overflow-x: auto; border-top: 1px solid var(--line); }
.cmp { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
.cmp th, .cmp td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp th[scope="row"] { color: var(--muted); font-weight: 500; white-space: nowrap; position: sticky; left: 0; background: var(--surface); }
.cmp td { font-variant-numeric: tabular-nums; min-width: 120px; }
.cmp thead th { font-family: var(--f-mono); font-size: 13px; }
.cmp tr.c th[scope="row"]::after { content: " ·calc"; color: var(--calc); font-family: var(--f-mono); font-size: 10px; }

.sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; }
.sheet-top { display: flex; align-items: center; gap: 8px; padding-inline: 8px 16px; padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.sheet-top .back { background: none; border: 0; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 20px; }
.sheet-top h2 { margin: 0; font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; padding-inline: 16px; padding-block: 14px calc(24px + env(safe-area-inset-bottom, 0px)); }

.hero-code { font-family: var(--f-display); font-size: 40px; line-height: 1; letter-spacing: .01em; word-break: break-all; }
.ticket { background: var(--label); color: var(--label-ink); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.ticket .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.ticket .bc { font-family: var(--f-mono); font-size: 12px; opacity: .8; }
.ticket .pt { color: var(--label-ink); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.grid > div { background: var(--surface); padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.grid .l { font-size: 11.5px; color: var(--muted); }
.grid .v { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; word-break: break-word; }
.grid.c .v { color: var(--calc); }
.note { font-size: 12px; color: var(--muted); padding: 8px 12px 12px; margin: 0; }
.spark { padding: 6px 12px 12px; }
.spark svg { width: 100%; height: auto; display: block; }
.hist { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.hist th, .hist td { padding: 7px 8px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
.hist th:first-child, .hist td:first-child { text-align: left; padding-left: 12px; }
.hist thead th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
.hist .absent { color: var(--muted); font-style: italic; }

.dayhead { position: sticky; top: 0; background: var(--sunk); padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-top: 1px solid var(--line); }
.ev-type { font-size: 11.5px; color: var(--muted); }

.import { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--label); transition: width .2s; }
.checks { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.ok { color: var(--up); font-weight: 600; } .ko { color: var(--down); font-weight: 600; }
.warnbox { border: 1px solid var(--down); color: var(--down); border-radius: 8px; padding: 9px 10px; font-size: 13px; }
.infobox { border: 1px dashed var(--line); border-radius: 8px; padding: 9px 10px; font-size: 13px; color: var(--muted); }
.snap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.snap b { font-weight: 600; }
.snap .sub { font-size: 12px; color: var(--muted); }
.snap .acts { display: flex; gap: 6px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--muted); flex: 0 0 auto; }
.dot.on { background: var(--up); } .dot.warn { background: var(--down); }
.paste { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 16px 12px; text-align: center; color: var(--muted); font-size: 16px; line-height: 1.35; background: var(--bg); caret-color: transparent; -webkit-user-select: text; user-select: text; outline: none; }
.paste:focus, .paste.over { border-color: var(--ink); color: var(--ink); background: var(--surface); }
.paste b { color: var(--ink); }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 11px 14px; font-size: 13.5px; max-width: 520px; margin-inline: auto; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.loading .bar { width: 200px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brandmark"><b>STOCK</b><span id="branchTag">—</span></div>
    <select id="snapSel" aria-label="Report da visualizzare"></select>
    <select id="branchSel" aria-label="Negozio" hidden></select>
  </div>
  <main id="main"><div class="loading" id="boot"><div class="bar"><i id="bootBar" style="width:15%"></i></div><span id="bootMsg">Apro lo storico…</span></div></main>
  <nav class="tabs" aria-label="Sezioni">
    <button data-tab="dash" aria-current="page"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>Oggi</button>
    <button data-tab="var"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg></span>Variazioni</button>
    <button data-tab="art"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6v12M7 6v12M10 6v12M13 6v12M17 6v12M20 6v12"/></svg></span>Articoli</button>
    <button data-tab="rep"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14l3-3 3 3"/></svg></span>Report</button>
  </nav>
</div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-top"><button class="back" id="sheetBack" aria-label="Indietro"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="sheetTitle"></h2></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<input type="file" id="fileIn" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/json,.json" hidden>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// Motore storico: confronta snapshot consecutivi e genera eventi.
// Distingue i DATI DEL REPORT (campi letti dal PDF) dai CALCOLI (differenze, stime).
(function (root) {
  const COLS = ['key', 'gender', 'brand', 'desc', 'style', 'rrp', 'sell', 'ptype', 'qty', 'frag', 'last', 'u7', 'v7', 'launch', 'loc', 'gcode'];
  const pack = (r) => COLS.map((c) => r[c] ?? '');
  const unpack = (a) => {
    const r = {};
    COLS.forEach((c, i) => { r[c] = a[i] ?? ''; });
    r.barcode = String(r.key).includes('|') ? '' : String(r.key).replace(/#\d+$/, '');
    return r;
  };

  const EVENT_TYPES = {
    nuovo: 'Nuovo style',
    tornato: 'Tornato disponibile',
    scomparso: 'Uscito dal report',
    zero: 'Arrivato a zero',
    qty_su: 'Stock in aumento',
    qty_giu: 'Stock in calo',
    prezzo: 'Cambio prezzo',
    rrp: 'Cambio RRP',
    promo: 'Entrato in promo (TK)',
    varprezzo: 'Variazione prezzo (NT)',
    full: 'Tornato Full',
    ptype: 'Cambio Price Type',
    u7: 'Vendite 7gg cambiate',
    v7: 'Valore vendite 7gg cambiato',
    last: 'Nuova data ultima vendita',
    taglie: 'Taglie cambiate',
  };

  const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 86400000);
  const r2 = (n) => Math.round(n * 100) / 100;

  function ptypeEvent(a, b) {
    if (a === b) return null;
    if (b === 'FULL') return 'full';
    if (a === 'FULL' && b === 'TK') return 'promo';
    if (a === 'FULL' && b === 'NT') return 'varprezzo';
    return 'ptype';
  }

  function diffPair(prev, cur, i, seenBefore) {
    const ev = [];
    const base = (r) => ({ i, key: r.key, style: r.style, desc: r.desc, brand: r.brand, gender: r.gender });
    const push = (r, type, field, old, nw, delta) => ev.push({ ...base(r), type, field, old, nw, delta: delta ?? null });
    for (const [k, c] of cur) {
      const p = prev.get(k);
      if (!p) {
        push(c, seenBefore.has(k) ? 'tornato' : 'nuovo', 'qty', null, c.qty, null);
        continue;
      }
      if (c.qty !== p.qty) {
        if (c.qty === 0) push(c, 'zero', 'qty', p.qty, 0, -p.qty);
        else push(c, c.qty > p.qty ? 'qty_su' : 'qty_giu', 'qty', p.qty, c.qty, c.qty - p.qty);
      }
      if (c.sell !== p.sell) push(c, 'prezzo', 'sell', p.sell, c.sell, r2(c.sell - p.sell));
      if (c.rrp !== p.rrp && c.ptype === p.ptype) push(c, 'rrp', 'rrp', p.rrp, c.rrp, r2(c.rrp - p.rrp));
      const pt = ptypeEvent(p.ptype, c.ptype);
      if (pt) push(c, pt, 'ptype', p.ptype, c.ptype, null);
      if (c.u7 !== p.u7) push(c, 'u7', 'u7', p.u7, c.u7, c.u7 - p.u7);
      if (c.v7 !== p.v7) push(c, 'v7', 'v7', p.v7, c.v7, r2(c.v7 - p.v7));
      if (c.last !== p.last) push(c, 'last', 'last', p.last || null, c.last || null, null);
      if (c.frag !== p.frag) push(c, 'taglie', 'frag', p.frag || null, c.frag || null, null);

  // snaps: [{meta, rows:[obj]}] dello stesso branch
  function buildModel(snaps) {
    const s = snaps.slice().sort((a, b) => String(a.meta.completed).localeCompare(String(b.meta.completed)));
    const model = { snaps: s.map((x) => ({ meta: x.meta, map: new Map(x.rows.map((r) => [r.key, r])) })), events: [], firstSeen: new Map() };
    const seen = new Set();
    model.snaps.forEach((sn, i) => {
      if (i > 0) model.events.push(...diffPair(model.snaps[i - 1].map, sn.map, i, seen));
      for (const k of sn.map.keys()) { if (!seen.has(k)) { seen.add(k); model.firstSeen.set(k, i); } }
    });

    for (const e of model.events) {

  // Stima vendite tra due snapshot (CALCOLO, non dato del report):
  // c'è stata almeno una vendita se la data di ultima vendita è avanzata
  // o, nello stesso giorno, se le vendite 7gg sono aumentate;
  // in quel caso la stima è il calo di stock, minimo 1.
  function estSales(p, c) {
    if (!p || !c) return null;
    const advanced = c.last && (!p.last || c.last > p.last);
    const u7up = c.u7 > p.u7;
    if (!advanced && !u7up) return 0;
    return Math.max(1, p.qty - c.qty, u7up && !advanced ? c.u7 - p.u7 : 0);
  }

  function history(model, key) {
    const out = [];
    let prev = null;
    model.snaps.forEach((sn, i) => {
      const r = sn.map.get(key) || null;
      out.push({ i, meta: sn.meta, row: r, delta: r && prev ? r.qty - prev.qty : null, est: prev && r ? estSales(prev, r) : null });
      prev = r;
    });
    return out;
  }

  // Righe dello snapshot i arricchite con i calcoli, confrontate con lo snapshot base (default: il precedente)
  function rowsAt(model, i, base) {
    const sn = model.snaps[i];
    if (!sn) return [];
    if (base == null) base = i - 1;
    const prev = base >= 0 ? model.snaps[base].map : null;
    const first = model.snaps[0].map;
    const out = [];
    for (const r of sn.map.values()) {
      const p = prev ? prev.get(r.key) : null;
      const fs = model.firstSeen.get(r.key);
      const f = first.get(r.key) || model.snaps[fs].map.get(r.key);
      let est = 0;
      for (let j = 1; j <= i; j++) est += estSales(model.snaps[j - 1].map.get(r.key), model.snaps[j].map.get(r.key)) || 0;
      out.push({
        ...r,
        calc: {
          prevQty: p ? p.qty : null,
          dPrev: p ? r.qty - p.qty : null,
          firstQty: f.qty,
          firstIdx: fs,
          fromDay1: first.has(r.key),
          dFirst: r.qty - f.qty,
          discount: r.rrp > 0 ? Math.round((1 - r.sell / r.rrp) * 100) : null,
          stockValue: r2(r.qty * r.sell),
          estSales: i > 0 ? est : null,
          daysSinceSale: r.last ? dayDiff(sn.meta.completed.slice(0, 10), r.last) : null,
          isNew: prev ? !p : false,
        },
      });
    }
    return out;
  }

  function seenUpTo(model, j) {
    const seen = new Set();
    for (let k = 0; k <= j; k++) for (const key of model.snaps[k].map.keys()) seen.add(key);
    return seen;
  }

  function summary(model, i, opts, base) {
    const o = Object.assign({ low: 2, oldDays: 60, bigAbs: 5, bigPct: 50 }, opts || {});
    if (base == null) base = i - 1;
    const rows = rowsAt(model, i, base);
    const ev = base === i - 1 ? model.events.filter((e) => e.i === i)
      : base >= 0 ? diffPair(model.snaps[base].map, model.snaps[i].map, i, seenUpTo(model, base)) : [];
    const by = (t) => ev.filter((e) => t.includes(e.type));
    const meta = model.snaps[i].meta;
    const styles = new Set(rows.map((r) => r.style));
    const withDelta = rows.filter((r) => r.calc.dPrev);
    return {
      meta,
      hasPrev: base >= 0,
      base,
      rows,
      stock: {
        qty: rows.reduce((s, r) => s + r.qty, 0),
        value: meta.declaredValue ?? r2(rows.reduce((s, r) => s + r.qty * r.sell, 0)),
        rows: rows.length,
        styles: styles.size,
        out: by(['scomparso', 'zero']),
        low: rows.filter((r) => r.qty > 0 && r.qty <= o.low).sort((a, b) => a.qty - b.qty || b.u7 - a.u7),
        up: withDelta.filter((r) => r.calc.dPrev > 0).sort((a, b) => b.calc.dPrev - a.calc.dPrev),
        down: withDelta.filter((r) => r.calc.dPrev < 0).sort((a, b) => a.calc.dPrev - b.calc.dPrev),
      },
      sales: {
        u7: rows.reduce((s, r) => s + r.u7, 0),
        v7: r2(rows.reduce((s, r) => s + r.v7, 0)),
        top: rows.filter((r) => r.u7 > 0).sort((a, b) => b.u7 - a.u7 || b.v7 - a.v7),
        none: rows.filter((r) => r.u7 === 0),
        recent: rows.filter((r) => r.last).sort((a, b) => b.last.localeCompare(a.last) || b.u7 - a.u7),
        old: rows.filter((r) => r.calc.daysSinceSale !== null && r.calc.daysSinceSale > o.oldDays).sort((a, b) => b.calc.daysSinceSale - a.calc.daysSinceSale),
        noDate: rows.filter((r) => !r.last),
      },
      prices: { promo: by(['promo']), varprezzo: by(['varprezzo']), full: by(['full']), change: by(['prezzo']), ptype: by(['ptype']) },
      news: {
        nuovi: by(['nuovo']),
        tornati: by(['tornato']),
        usciti: by(['scomparso', 'zero']),
        big: ev.filter((e) => (e.type === 'qty_su' || e.type === 'qty_giu') && (Math.abs(e.delta) >= o.bigAbs || (e.old > 0 && Math.abs(e.delta) / e.old * 100 >= o.bigPct && Math.abs(e.delta) >= 2))),
      },
      events: ev,
    };
  }

  const api = { COLS, pack, unpack, buildModel, history, rowsAt, summary, estSales, EVENT_TYPES, diffPair };
  if (typeof module !== 'undefined') module.exports = api; else root.NODEngine = api;
})(this);

<script>
// Lettura degli export Excel "Items Not on Display" e "Condensed List".
// Il Condensed List contiene da solo tessile, calzature e accessori.
(function (root) {
  const GENDER = {
    A: 'Mens Textiles', B: 'Mens Textiles', C: 'Replica Textiles', D: 'Womens Textiles', E: 'Junior Textiles', F: 'Infant Textiles',
    G: 'Accessories',
    K: 'Mens Footwear', L: 'Womens Footwear', M: 'Junior Footwear', N: 'Childrens Footwear', O: 'Infant Footwear',
  };
  const PART_OF = { A: 'T', B: 'T', C: 'T', D: 'T', E: 'T', F: 'T', G: 'A', K: 'F', L: 'F', M: 'F', N: 'F', O: 'F' };
  const PART_NAME = { T: 'Tessile', F: 'Calzature', A: 'Accessori' };
  const MONTHS = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
  const pad = (n) => String(n).padStart(2, '0');
  const COLMAP = {
    gender: /^gender$/i, brand: /^brand$/i, desc: /^description$/i, style: /^style( code)?$/i,
    rrp: /^rrp/i, sell: /^sell/i, ptype: /full\/tk\/nt|price type/i, qty: /^qty$/i,
    last: /^last sales? date/i, u7: /^sales units/i, v7: /^sales value/i, launch: /^launch/i,
  };

  function excelDate(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number') { // numero seriale Excel
      const d = new Date(Math.round((v - 25569) * 86400000));
      return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    }
    if (v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
    const s = String(v).trim();
    let m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
    if (m) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
    m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return '';
  }
  const num = (v) => { if (typeof v === 'number') return v; const n = parseFloat(String(v ?? '').replace(',', '.').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
  const str = (v) => (v == null ? '' : String(v)).replace(/\s+/g, ' ').trim();

  // aoa: righe del primo foglio come array di array
  function parseSheet(aoa, filename) {
    const warnings = [];
    let hdrRow = aoa.findIndex((r) => r && r.some((c) => /^gender$/i.test(str(c))) && r.some((c) => /^style/i.test(str(c))));
    if (hdrRow < 0) return { error: `${filename}: non trovo le colonne Gender e Style. Non sembra un export Not on Display.` };
    const titleRow = (aoa.slice(0, hdrRow).find((r) => r && r.some((c) => /Date:/i.test(str(c)))) || []).map(str);
    const title = str(titleRow[0] || (aoa[0] || [])[0]);
    const dRaw = (titleRow.find((c) => /^Date:/i.test(c)) || '').replace(/^Date:/i, '').trim();
    const tRaw = (titleRow.find((c) => /^Time:/i.test(c)) || '').replace(/^Time:/i, '').trim();
    const bRaw = (titleRow.find((c) => /^Branch:/i.test(c)) || '').replace(/^Branch:/i, '').trim();
    const dm = /^(\d{1,2})([A-Z]{3})(\d{2,4})$/i.exec(dRaw);
    const date = dm && MONTHS[dm[2].toUpperCase()] ? `${dm[3].length === 2 ? 2000 + +dm[3] : dm[3]}-${pad(MONTHS[dm[2].toUpperCase()])}-${pad(+dm[1])}` : null;
    const time = /^\d{1,2}:\d{2}$/.test(tRaw) ? tRaw.padStart(5, '0') : '00:00';
    const hdr = aoa[hdrRow].map(str);
    const col = {};
    for (const [k, re] of Object.entries(COLMAP)) col[k] = hdr.findIndex((h) => re.test(h));
    const locCols = hdr.map((h, i) => (/^location/i.test(h) ? i : -1)).filter((i) => i >= 0);
    const missing = ['gender', 'style', 'qty', 'sell'].filter((k) => col[k] < 0);
    if (missing.length) return { error: `${filename}: mancano le colonne ${missing.join(', ')}.` };
    const rows = []; const unknown = new Set(); const parts = new Set();
    for (const r of aoa.slice(hdrRow + 1)) {
      if (!r || !str(r[col.style])) continue;
      const code = str(r[col.gender]).toUpperCase();
      if (!GENDER[code]) unknown.add(code); else parts.add(PART_OF[code]);
      const g = (k) => (col[k] >= 0 ? r[col[k]] : '');
      rows.push({
        gcode: code,
        gender: GENDER[code] || `Codice ${code}`,
        brand: str(g('brand')), desc: str(g('desc')), style: str(g('style')),
        rrp: num(g('rrp')), sell: num(g('sell')), ptype: str(g('ptype')).toUpperCase(), qty: num(g('qty')),
        last: excelDate(g('last')), u7: num(g('u7')), v7: Math.round(num(g('v7')) * 100) / 100, launch: excelDate(g('launch')),
        loc: locCols.map((i) => str(r[i])).filter(Boolean).join(', '),
        frag: '',
      });
    }
    if (unknown.size) warnings.push(`Codici reparto non riconosciuti: ${[...unknown].join(', ')}`);
    const kind = /condensed/i.test(title) || /condensed/i.test(filename) ? 'condensed' : 'part';
    return { kind, title, date, time, branch: bRaw, rows, parts: [...parts], warnings, filename };
  }

  // Unisce righe con stesso reparto e Style Code (es. due linee prezzo dello stesso articolo)
  function consolidate(rows) {
    const map = new Map(); const order = [];
    for (const r of rows) {
      const key = `${r.gcode}|${r.style}`;
      const prev = map.get(key);
      if (!prev) { map.set(key, { ...r, key, lines: 1, mainQty: r.qty }); order.push(key); continue; }
      prev.lines++;
      if (r.qty > prev.mainQty) Object.assign(prev, { rrp: r.rrp, sell: r.sell, ptype: r.ptype, mainQty: r.qty, desc: r.desc });
      prev.qty += r.qty; prev.u7 += r.u7; prev.v7 = Math.round((prev.v7 + r.v7) * 100) / 100;
      if (r.last > prev.last) prev.last = r.last;
      if (r.loc) prev.loc = [...new Set((prev.loc ? prev.loc.split(', ') : []).concat(r.loc.split(', ')))].join(', ');

    return order.map((k) => { const x = map.get(k); delete x.mainQty; return x; });
  }

  // Taglie dal PDF (facoltativo): il PDF le elenca solo fino a 3 pezzi
  function attachSizes(rows, pdfRows) {
    // le uso solo se i pezzi per taglia tornano con la quantità dell'Excel
    const idx = new Map();
    for (const p of pdfRows || []) {
      const k = `${p.gender}|${p.style.replace(/\s+/g, '').toUpperCase()}`;
      const e = idx.get(k) || { frag: [], qty: 0, all: true };
      e.qty += p.qty; if (p.frag) e.frag.push(p.frag); else e.all = false;
      idx.set(k, e);
    }
    let n = 0, partial = 0;
    for (const r of rows) {
      const e = idx.get(`${r.gender}|${r.style.replace(/\s+/g, '').toUpperCase()}`);
      if (!e || !e.frag.length) continue;
      if (e.all && e.qty === r.qty) { r.frag = e.frag.join(', '); n++; } else partial++;
    }

  }

  // sheets: risultati di parseSheet; pdf: risultato del parser PDF (facoltativo)
  function combine(sheets, pdf) {
    const errors = sheets.filter((s) => s.error).map((s) => s.error);
    const ok = sheets.filter((s) => !s.error);
    if (!ok.length) return { error: errors.join(' ') || 'Nessun file Excel valido.' };
    const condensed = ok.find((s) => s.kind === 'condensed');
    const used = condensed ? [condensed] : ok;
    const ignored = condensed ? ok.filter((s) => s !== condensed).map((s) => s.filename) : [];
    const dates = [...new Set(used.map((s) => s.date))];
    const branches = [...new Set(used.map((s) => s.branch))];
    const warnings = [...errors, ...used.flatMap((s) => s.warnings)];
    if (dates.length > 1) return { error: `I file sono di giorni diversi (${dates.join(', ')}). Carica i file dello stesso giorno.` };
    if (branches.length > 1) return { error: `I file sono di negozi diversi (${branches.join(', ')}).` };
    const parts = new Set(used.flatMap((s) => s.parts));
    const missingParts = ['T', 'F', 'A'].filter((p) => !parts.has(p)).map((p) => PART_NAME[p]);
    const rows = consolidate(used.flatMap((s) => s.rows));
    let sizes = 0;
    const pdfSameDay = pdf && pdf.rows && pdf.meta && pdf.meta.completed && dates[0] && pdf.meta.completed.slice(0, 10) === dates[0];
    if (pdfSameDay) sizes = attachSizes(rows, pdf.rows);
    const time = used.map((s) => s.time).sort().pop();
    const meta = {
      source: 'xlsx', kind: condensed ? 'condensed' : 'parts',
      completed: dates[0] ? `${dates[0]}T${time}` : null,
      branch: branches[0] || '', branchName: '',
      files: used.map((s) => s.filename), ignored,
      sizesFromPdf: sizes, sizesSkipped: rows.partialSizes || 0, pdfDate: pdf && pdf.meta ? pdf.meta.completed : null,
    };
    if (pdf && pdf.meta && pdf.meta.branchName && pdf.meta.branch === meta.branch) meta.branchName = pdf.meta.branchName;
    const value = Math.round(rows.reduce((s, r) => s + r.qty * r.sell, 0) * 100) / 100;
    const checks = { complete: missingParts.length === 0, missingParts, rows: rows.length, value, qty: rows.reduce((s, r) => s + r.qty, 0), dateOk: !!meta.completed };
    if (pdf && pdf.meta && pdf.meta.completed && dates[0] && pdf.meta.completed.slice(0, 10) !== dates[0]) warnings.push(`Il PDF per le taglie è del ${pdf.meta.completed.slice(0, 10)}, gli Excel del ${dates[0]}: taglie non usate.`);
    return { meta, rows, checks, warnings };
  }

  // Legge il primo foglio di una cartella SheetJS. Questi export dichiarano un'area
  // più piccola di quella reale: la ricalcolo dalle celle presenti.
  function sheetRows(XLSX, wb) {
    const ws = wb.Sheets[wb.SheetNames[0]];
    let maxR = 0, maxC = 0;
    for (const k of Object.keys(ws)) {
      if (k[0] === '!') continue;
      const c = XLSX.utils.decode_cell(k);
      if (c.r > maxR) maxR = c.r; if (c.c > maxC) maxC = c.c;
    }
    ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } });
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  }

  const api = { parseSheet, combine, consolidate, attachSizes, sheetRows, GENDER };
  if (typeof module !== 'undefined') module.exports = api; else root.NODXlsx = api;
})(this);

(function () {

const nf = new Intl.NumberFormat('it-IT');

const ef0 = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fN = (n) => n == null ? '—' : nf.format(n);
const fE = (n) => n == null ? '—' : ef.format(n);
const fD = (iso) => { if (!iso) return '—'; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y.slice(2)}`; };
const DOW = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const fSnap = (m) => { if (!m || !m.completed) return '—'; const d = new Date(m.completed.slice(0, 10) + 'T12:00:00'); return `${DOW[d.getDay()]} ${fD(m.completed)} · ${m.completed.slice(11, 16)}`; };

function idbOpen() {
  return new Promise((res) => {
    try {

      rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('meta'); d.createObjectStore('rows'); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}

  return new Promise((res) => {
    if (!db) return res(null);
    try {
      const tx = db.transaction(store, mode); const st = tx.objectStore(store);
      const rq = fn(st);
      tx.oncomplete = () => res(rq ? rq.result : true);
      tx.onerror = () => res(null);

  });

  },

    const n = Math.ceil(packed.length / PART);
    const full = { ...meta, parts: n, rows: packed.length, cols: E.COLS, importedAt: new Date().toISOString() };
    if (this.cloud) {
      for (let i = 0; i < n; i++) {
        await this.cloud.doc(`snaps/${meta.id}/parts/p${i}`).set({ i, r: packed.slice(i * PART, (i + 1) * PART) });
        onStep && onStep(i + 1, n + 1);
      }
      await this.cloud.doc(`snaps/${meta.id}`).set(full);
      await idbDo(this.idb, 'rows', 'readwrite', (s) => s.put(packed, meta.id));
    } else if (this.idb) {
      await idbDo(this.idb, 'rows', 'readwrite', (s) => s.put(packed, meta.id));
      await idbDo(this.idb, 'meta', 'readwrite', (s) => s.put(full, meta.id));
    } else { this.mem.rows[meta.id] = packed; this.mem.meta[meta.id] = full; }
    onStep && onStep(n + 1, n + 1);
    return full;
  },
  async remove(meta) {
    if (this.cloud) {
      await this.cloud.doc(`snaps/${meta.id}`).delete();
      for (let i = 0; i < meta.parts; i++) await this.cloud.doc(`snaps/${meta.id}/parts/p${i}`).delete();
    } else if (this.idb) await idbDo(this.idb, 'meta', 'readwrite', (s) => s.delete(meta.id));
    else delete this.mem.meta[meta.id];
    await idbDo(this.idb, 'rows', 'readwrite', (s) => s.delete(meta.id));
  },
};

const DEPTS = { Mens: 'Uomo', Womens: 'Donna', Junior: 'Junior', Childrens: 'Bambino', Infant: 'Infant', Replica: 'Replica' };
const CATS = { Footwear: 'Calzature', Textiles: 'Abbigliamento' };
const LETTER = { "XXS": 'XXS', "XXSW)": 'XXS', "X'SML": 'XS', "XS": 'XS', "SML": 'S', "S": 'S', "MED": 'M', "M": 'M', "LGE": 'L', "L": 'L', "X'LGE": 'XL', "XLGE": 'XL', "XL": 'XL', "XX'LGE": 'XXL', "XXL": 'XXL' };
const LETTER_ORDER = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL'];
function normSize(raw, foot) {
  let x = String(raw).trim().replace(/"$/, '');
  if (foot && /^\d{3}$/.test(x) && +x % 5 === 0 && +x >= 150 && +x <= 500) return String(+x / 10);
  const slash = /^\d+\/(.+)$/.exec(x); if (slash && LETTER[slash[1]]) return LETTER[slash[1]];
  const w = /^(.+)\(W\)$/.exec(x); if (w && LETTER[w[1]]) return LETTER[w[1]];
  if (LETTER[x]) return LETTER[x];
  const jr = /^(\d{2})R$/.exec(x); if (jr) return jr[1];
  return x;
}
function sizeKey(z) {
  const li = LETTER_ORDER.indexOf(z); if (li >= 0) return [1, li];
  const fr = /^(\d+(?:\.\d+)?)(?:\s+(\d)\/(\d))?$/.exec(z); if (fr) return [0, +fr[1] + (fr[2] ? fr[2] / fr[3] : 0)];
  const age = /^(\d+)(?:-(\d+))?(MTH|YRS)$/.exec(z); if (age) return [2, (age[3] === 'MTH' ? 0 : 100) + +age[1]];
  const n = parseFloat(z); return isFinite(n) ? [3, n] : [4, 0];
}
const sizeCmp = (a, b) => { const x = sizeKey(a), y = sizeKey(b); return x[0] - y[0] || x[1] - y[1] || a.localeCompare(b); };
function enrich(r) {
  const m = /^(\w+)\s+(\w+)/.exec(r.gender || '');
  if (/^Accessories/i.test(r.gender)) { r.dept = 'Accessori'; r.cat = 'Accessori'; }
  else { r.dept = m ? DEPTS[m[1]] || m[1] : r.gender; r.cat = m ? CATS[m[2]] || m[2] : r.gender; }
  const foot = /Footwear/i.test(r.gender);
  r.frag = '';
  r.sizes = !r.frag ? [] : r.frag.split(',').map((p) => p.trim()).filter(Boolean).map((p) => {
    const mm = /^(.*?)\s*\((\d+)\)$/.exec(p);
    return { z: normSize(mm ? mm[1] : p, foot), raw: mm ? mm[1] : p, n: mm ? +mm[2] : 1 };
  });
  return r;
}

async function loadAll(keepIdx) {
  S.metas = (await Store.listMeta()).filter((m) => m && m.id && m.completed).sort((a, b) => a.completed.localeCompare(b.completed));
  const active = S.metas.filter((m) => m.source === 'xlsx');
  const branches = [...new Set(active.map((m) => m.branch))];
  if (!S.branch || !branches.includes(S.branch)) S.branch = active.length ? active[active.length - 1].branch : null;
  const bs = $('#branchSel');
  bs.hidden = branches.length < 2;
  bs.innerHTML = branches.map((b) => { const m = active.find((x) => x.branch === b); return `<option value="${esc(b)}"${b === S.branch ? ' selected' : ''}>${esc(b)} ${esc(m.branchName || '')}</option>`; }).join('');
  const mine = active.filter((m) => m.branch === S.branch);
  const snaps = [];
  let done = 0;
  for (const m of mine) {
    const packed = await Store.loadRows(m);
    snaps.push({ meta: m, rows: packed.map((a) => enrich(E.unpack(a))) });
    done++;
    const b = $('#bootBar'); if (b) { b.style.width = `${15 + 85 * done / mine.length}%`; $('#bootMsg').textContent = `Carico lo storico: ${done} di ${mine.length} report`; }
  }
  S.model = snaps.length ? E.buildModel(snaps) : null;
  sumCache = { k: null, v: {} };
  const n = S.model ? S.model.snaps.length : 0;
  S.idx = keepIdx != null && keepIdx < n ? keepIdx : n - 1;
  S.ev.to = null; S.ev.from = null;
  $('#branchTag').textContent = S.branch || '—';
  renderSnapSel();
}

function evBody() {
  const inRange = S.model.events.filter((e) => e.i > S.ev.from && e.i <= S.ev.to);
  const q = norm(S.ev.q);
  const counts = {};
  inRange.forEach((e) => { counts[e.type] = (counts[e.type] || 0) + 1; });
  const list = inRange.filter((e) => S.ev.types.has(e.type) && (!q || norm(e.style).includes(q) || norm(e.desc).includes(q) || norm(e.brand).includes(q)));
  let h = `<div class="card"><div class="toolbar" style="padding:12px 12px 2px"><span>${fN(list.length)} cambiamenti</span>${tagC}</div>`;

    h += types.map((t) => `<button class="chip" data-evt="${t}" aria-pressed="${S.ev.types.has(t)}">${E.EVENT_TYPES[t]}<span class="n">${fN(counts[t] || 0)}</span></button>`).join('');

  for (const e of list.slice().sort((a, b) => b.i - a.i || order.indexOf(a.type) - order.indexOf(b.type) || String(a.style).localeCompare(String(b.style)))) {
