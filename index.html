    for (const t of tokens) {
      let m = rows.filter((r) => norm(r.style) === t);
      if (!m.length) m = rows.filter((r) => norm(r.style).includes(t) || norm(r.barcode) === t);
      if (m.length) m.forEach((r) => { if (!found.includes(r)) found.push(r); }); else missing.push(t);
    }
    h += `<div class="toolbar"><span>Confronto: ${fN(found.length)} righe ${tagR} ${tagC}</span></div>`;
    if (missing.length) h += `<div class="warnbox">Non presenti in questo report: ${missing.map(esc).join(', ')}</div>`;
    if (found.length) h += compareTable(found);
    return h;
  }
  // ogni elenco a tendina mostra solo le voci compatibili con gli altri filtri principali
  const pass = (r, skip) => (
    (tokens.length !== 1 || norm(r.style).includes(tokens[0]) || norm(r.desc).includes(tokens[0]) || (r.barcode && norm(r.barcode).includes(tokens[0])) || (r.loc && norm(r.loc).includes(tokens[0]))) &&
    (skip === 'dept' || !a.dept || r.dept === a.dept) && (skip === 'cat' || !a.cat || r.cat === a.cat) &&
    (skip === 'brand' || !a.brand || r.brand === a.brand));
  const countBy = (skip, keyFn) => { const m = new Map(); rows.forEach((r) => { if (pass(r, skip)) for (const k of keyFn(r)) m.set(k, (m.get(k) || 0) + 1); }); return m; };
  const deptC = countBy('dept', (r) => [r.dept]);
  const catC = countBy('cat', (r) => [r.cat]);
  const brandC = countBy('brand', (r) => [r.brand]);
  const DEPT_ORDER = ['Uomo', 'Donna', 'Junior', 'Bambino', 'Infant', 'Replica', 'Accessori'];
  const f = rows.filter((r) => {
    if (!pass(r)) return false;
    if (a.ptype && r.ptype !== a.ptype) return false;
    if (a.qmin !== '' && r.qty < +a.qmin) return false;
    if (a.qmax !== '' && r.qty > +a.qmax) return false;
    if (a.u7min !== '' && r.u7 < +a.u7min) return false;
    if (a.loc && !(r.loc || '').split(', ').some((l) => l.startsWith(a.loc))) return false;
    if (a.lastOld === 'none' && r.last) return false;
    if (a.lastOld && a.lastOld !== 'none' && !(r.calc.daysSinceSale > +a.lastOld)) return false;
    if (a.onlyNew && !r.calc.isNew) return false;
    return true;
  });
  const sorts = {
    qty: (x, y) => y.qty - x.qty, qtyAsc: (x, y) => x.qty - y.qty, u7: (x, y) => y.u7 - x.u7 || y.v7 - x.v7,
    last: (x, y) => (y.last || '').localeCompare(x.last || ''), lastOld: (x, y) => (x.last || '0').localeCompare(y.last || '0'),
    dPrev: (x, y) => (x.calc.dPrev ?? 0) - (y.calc.dPrev ?? 0), value: (x, y) => y.calc.stockValue - x.calc.stockValue,
    style: (x, y) => x.style.localeCompare(y.style),
  };
  f.sort(sorts[a.sort] || sorts.qty);
  const mainActive = ['dept', 'cat', 'brand'].filter((k) => a[k] !== '').length;
  const active = ['ptype', 'qmin', 'qmax', 'u7min', 'lastOld', 'loc'].filter((k) => a[k] !== '').length + (a.onlyNew ? 1 : 0);
  const o = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`;
  const opts = (map, cur, order) => { const keys = [...map.keys()]; if (cur && !map.has(cur)) keys.push(cur); keys.sort(order || ((x, y) => x.localeCompare(y))); return keys.map((k) => o(k, `${k} (${fN(map.get(k) || 0)})`, cur)).join(''); };
  const byDept = (x, y) => DEPT_ORDER.indexOf(x) - DEPT_ORDER.indexOf(y);
  h += `<section class="card"><div class="filters" style="padding-top:12px">
    <div class="row2"><div class="field"><label for="fDept">Reparto</label><select id="fDept">${o('', 'Tutti', a.dept)}${opts(deptC, a.dept, byDept)}</select></div>
    <div class="field"><label for="fCat">Categoria</label><select id="fCat">${o('', 'Tutte', a.cat)}${opts(catC, a.cat)}</select></div></div>
    <div class="field"><label for="fBrand">Brand</label><select id="fBrand">${o('', 'Tutti', a.brand)}${opts(brandC, a.brand)}</select></div>
    ${mainActive ? '<button class="btn" data-clearmain>Azzera reparto, categoria e brand</button>' : ''}
  </div>
  <header style="padding-top:0"><button class="btn ghost" data-togglefilters style="padding-inline:0;border:0">Altri filtri${active ? ` (${active})` : ''} ${a.showFilters ? '▴' : '▾'}</button>
    <select id="artSort" aria-label="Ordina" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px">
      ${o('qty', 'Stock ↓', a.sort)}${o('qtyAsc', 'Stock ↑', a.sort)}${o('u7', 'Vendite 7gg ↓', a.sort)}${o('last', 'Vendita più recente', a.sort)}${o('lastOld', 'Vendita più vecchia', a.sort)}${o('dPrev', 'Calo dal confronto', a.sort)}${o('value', 'Valore stock ↓', a.sort)}${o('style', 'Style Code A-Z', a.sort)}
    </select></header>`;
  if (a.showFilters) {
    h += `<div class="filters">
      <div class="row2"><div class="field"><label for="fPtype">Price Type</label><select id="fPtype">${o('', 'Tutti', a.ptype)}${o('FULL', 'FULL', a.ptype)}${o('TK', 'TK · promo', a.ptype)}${o('NT', 'NT · variazione prezzo', a.ptype)}</select></div>
      <div class="field"><label for="fLast">Ultima vendita</label><select id="fLast">${o('', 'Qualsiasi', a.lastOld)}${o('30', 'Più di 30 giorni fa', a.lastOld)}${o('60', 'Più di 60 giorni fa', a.lastOld)}${o('90', 'Più di 90 giorni fa', a.lastOld)}${o('180', 'Più di 180 giorni fa', a.lastOld)}${o('none', 'Nessuna data nel report', a.lastOld)}</select></div></div>
      <div class="row2"><div class="field"><label for="fQmin">Stock da</label><input id="fQmin" inputmode="numeric" value="${esc(a.qmin)}" placeholder="0"></div>
      <div class="field"><label for="fQmax">Stock fino a</label><input id="fQmax" inputmode="numeric" value="${esc(a.qmax)}" placeholder="∞"></div></div>
      <div class="field"><label for="fLoc">Ubicazione (anche solo l'inizio del codice)</label><input id="fLoc" inputmode="numeric" value="${esc(a.loc)}" placeholder="es. 12901"></div>
      <div class="row2"><div class="field"><label for="fU7">Vendite 7gg almeno</label><input id="fU7" inputmode="numeric" value="${esc(a.u7min)}" placeholder="0"></div>
      <div class="field"><label for="fNew">Novità</label><select id="fNew">${o('', 'Tutti', a.onlyNew ? '1' : '')}${o('1', 'Solo nuovi in questo report', a.onlyNew ? '1' : '')}</select></div></div>
      ${active ? '<button class="btn" data-clearfilters>Azzera filtri</button>' : ''}
    </div>`;
  }
  const totQ = f.reduce((x, r) => x + r.qty, 0), totU = f.reduce((x, r) => x + r.u7, 0);
  h += `<div class="toolbar" style="padding:0 12px 10px"><span>${fN(f.length)} righe · ${fN(totQ)} pz · ${fN(totU)} venduti 7gg</span></div><div class="list">`;
  h += f.slice(0, a.limit).map((r) => {
    const sub = `${pt(r.ptype)} ${fE(r.sell)}`;
    return rowItem(r, `<span class="big">${fN(r.qty)}</span><span class="small">${sub}</span>${r.calc.dPrev ? dp(r.calc.dPrev) : ''}`);
  }).join('');
  if (!f.length) h += `<div class="empty">Nessun articolo trovato.</div>`;
  if (f.length > a.limit) h += `<button class="more" data-artmore><span>Mostra altri</span><span class="num">${fN(f.length - a.limit)}</span></button>`;
  return h + '</div></section>';
}

function compareTable(rs) {
  const hasPrev = S.idx > 0;
  const lines = [
    ['Brand', (r) => esc(r.brand)], ['Categoria', (r) => esc(r.gender)], ['Descrizione', (r) => esc(r.desc)],
    ['Stock', (r) => `<b>${fN(r.qty)}</b>`],
    [`Δ ${cmpLabel() || 'dal precedente'}`, (r) => hasPrev ? (r.calc.dPrev == null ? 'nuovo' : dp(r.calc.dPrev) || '0') : '—', 1],
    ['Stock iniziale', (r) => `${fN(r.calc.firstQty)}${r.calc.fromDay1 ? '' : ' (dal ' + fD(S.model.snaps[r.calc.firstIdx].meta.completed) + ')'}`, 1],
    ['Δ da inizio', (r) => dp(r.calc.dFirst) || '0', 1],
    ['Prezzo vendita', (r) => fE(r.sell)], ['RRP', (r) => r.rrp ? fE(r.rrp) : '—'], ['Price Type', (r) => pt(r.ptype)],
    ['Sconto su RRP', (r) => discTxt(r.calc.discount), 1],
    ['Vendite 7gg', (r) => fN(r.u7)], ['Valore 7gg', (r) => fE(r.v7)], ['Ultima vendita', (r) => fD(r.last)],
    ['Stima vendite', (r) => r.calc.estSales == null ? '—' : fN(r.calc.estSales), 1],
    ['Ubicazione', (r) => r.loc ? `<span class="mono">${esc(r.loc)}</span>` : '—'],
  ];
  return `<div class="card"><div class="cmpwrap" style="border:0"><table class="cmp"><thead><tr><th scope="col"></th>${rs.map((r) => `<th scope="col"><button class="code" data-open="${esc(r.key)}" style="background:none;border:0;padding:0;text-decoration:underline">${esc(r.style)}</button></th>`).join('')}</tr></thead><tbody>${lines.map((l) => `<tr${l[2] ? ' class="c"' : ''}><th scope="row">${l[0]}</th>${rs.map((r) => `<td>${l[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="note">Le righe marcate ·calc sono calcolate dall'app confrontando i report. La stima vendite conta i movimenti in cui la data di ultima vendita avanza o le vendite 7gg aumentano.</p></div>`;
}

/* ---------- scheda articolo ---------- */
function sparkline(hist) {
  const pts = hist.map((h, i) => ({ i, q: h.row ? h.row.qty : null }));
  const vals = pts.filter((p) => p.q != null).map((p) => p.q);
  if (pts.length < 2) return '';
  const W = 320, H = 86, pl = 26, pr = 10, pt_ = 10, pb = 18;
  const max = Math.max(1, ...vals), n = pts.length;
  const x = (i) => pl + (W - pl - pr) * (n === 1 ? 0 : i / (n - 1));
  const y = (q) => pt_ + (H - pt_ - pb) * (1 - q / max);
  let path = '', area = '', seg = [];
  const flush = () => { if (seg.length) { path += 'M' + seg.map((p) => `${x(p.i).toFixed(1)},${y(p.q).toFixed(1)}`).join('L'); area += `M${x(seg[0].i).toFixed(1)},${y(0)}L` + seg.map((p) => `${x(p.i).toFixed(1)},${y(p.q).toFixed(1)}`).join('L') + `L${x(seg[seg.length - 1].i).toFixed(1)},${y(0)}Z`; } seg = []; };
  pts.forEach((p) => { if (p.q == null) flush(); else seg.push(p); }); flush();
  const last = [...pts].reverse().find((p) => p.q != null);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento stock">
    <line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <line x1="${pl}" x2="${W - pr}" y1="${y(max)}" y2="${y(max)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="${pl - 5}" y="${y(max) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${max}</text>
    <text x="${pl - 5}" y="${y(0) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">0</text>
    <text x="${pl}" y="${H - 3}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fD(hist[0].meta.completed)}</text>
    <text x="${W - pr}" y="${H - 3}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fD(hist[n - 1].meta.completed)}</text>
    <path d="${area}" fill="var(--label)" fill-opacity=".35"/>
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    ${last ? `<circle cx="${x(last.i)}" cy="${y(last.q)}" r="4" fill="var(--ink)"/>` : ''}
  </svg>`;
}

function openItem(key) {
  const rowsNow = summ().rows;
  let r = rowsNow.find((x) => x.key === key);
  const hist = E.history(S.model, key);
  const lastSeen = [...hist].reverse().find((h) => h.row);
  const base = r || (lastSeen && lastSeen.row);
  if (!base) return;
  const g = (l, v) => `<div><span class="l">${l}</span><span class="v">${v}</span></div>`;
  let h = `<div class="view"><div class="ticket"><div class="hero-code">${esc(base.style)}</div><div style="font-weight:600">${esc(base.desc)}</div>
    <div class="meta"><span>${esc(base.brand)}</span><span>${esc(base.gender)}</span><span>${pt(base.ptype)}</span><span>${esc(S.model.snaps[S.idx].meta.branch)} ${esc(S.model.snaps[S.idx].meta.branchName || '')}</span></div>
    ${base.barcode ? `<div class="bc">${esc(base.barcode)}</div>` : ''}${base.loc ? `<div class="bc">Ubicazione ${esc(base.loc)}</div>` : ''}</div>`;
  if (!r) h += `<div class="warnbox">Non presente nel report del ${fD(S.model.snaps[S.idx].meta.completed)}. Ultima presenza: ${fD(lastSeen.meta.completed)} con ${fN(lastSeen.row.qty)} pz. L'assenza può dipendere da esaurimento, trasferimento o esposizione.</div>`;
  else {
    h += `<section class="card"><header><h2>Dati del report</h2>${tagR}</header><div class="grid">
      ${g('Stock attuale', fN(r.qty) + ' pz')}${g('Prezzo vendita', fE(r.sell))}${g('RRP', r.rrp ? fE(r.rrp) : '—')}
      ${g('Price Type', pt(r.ptype))}${g('Vendite 7gg', fN(r.u7) + ' pz')}${g('Valore vendite 7gg', fE(r.v7))}
      ${g('Ultima vendita', fD(r.last))}${g('Ubicazione', r.loc ? `<span class="mono">${esc(r.loc)}</span>` : '—')}${g('Launch', fD(r.launch))}
    </div><p class="note">Vendite 7gg è un totale mobile degli ultimi 7 giorni, non le vendite di oggi.</p></section>
    <section class="card"><header><h2>Calcoli</h2>${tagC}</header><div class="grid c">
      ${g('Stock iniziale', fN(r.calc.firstQty) + (r.calc.fromDay1 ? ' (Giorno 1)' : ' (dal ' + fD(S.model.snaps[r.calc.firstIdx].meta.completed) + ')'))}
      ${g(`Δ ${esc(cmpLabel() || 'dal precedente')}`, S.idx > 0 ? (r.calc.dPrev == null ? 'nuovo' : dp(r.calc.dPrev) || '0') : '—')}
      ${g('Δ da inizio', dp(r.calc.dFirst) || '0')}
      ${g('Valore in stock', fE(r.calc.stockValue))}${g('Sconto su RRP', discTxt(r.calc.discount))}
      ${g('Giorni da ultima vendita', r.calc.daysSinceSale ?? '—')}
      ${g('Stima vendite nel periodo', r.calc.estSales == null ? 'dal 2° report' : fN(r.calc.estSales))}
    </div><p class="note">Un calo di stock non è per forza una vendita: può essere un trasferimento o un altro movimento. La stima vendite conta solo i passaggi tra report in cui la data di ultima vendita avanza o le vendite 7gg aumentano.</p></section>`;
  }
  h += `<section class="card"><header><h2>Andamento</h2>${tagC}</header><div class="spark">${sparkline(hist)}</div>
    <div style="overflow-x:auto"><table class="hist"><thead><tr><th>Report</th><th>Qty</th><th>Δ</th><th>Prezzo</th><th>Type</th><th>7gg</th><th>Stima</th></tr></thead><tbody>
    ${hist.slice().reverse().map((x) => x.row ? `<tr><td>${fD(x.meta.completed)} ${x.meta.completed.slice(11, 16)}</td><td><b>${fN(x.row.qty)}</b></td><td>${x.delta == null ? '' : dp(x.delta) || '0'}</td><td>${fE(x.row.sell)}</td><td>${pt(x.row.ptype)}</td><td>${fN(x.row.u7)}</td><td>${x.est == null ? '' : x.est}</td></tr>` : `<tr><td>${fD(x.meta.completed)} ${x.meta.completed.slice(11, 16)}</td><td colspan="6" class="absent">non presente nel report</td></tr>`).join('')}
    </tbody></table></div></section>`;
  const evs = (S.model.eventsByKey.get(key) || []).slice().sort((a, b) => b.i - a.i);
  h += `<section class="card"><header><h2>Variazioni registrate</h2>${tagC}</header><div class="list">`;
  if (!evs.length) h += `<div class="empty">${S.model.snaps.length < 2 ? 'Compariranno dal secondo report.' : 'Nessuna variazione finora.'}</div>`;
  let li = null;
  for (const e of evs) {
    if (e.i !== li) { h += `<div class="dayhead">${esc(fSnap(S.model.snaps[e.i].meta))}</div>`; li = e.i; }
    h += `<div class="ri" style="cursor:default"><span class="ri-main"><span style="font-weight:600">${esc(E.EVENT_TYPES[e.type])}</span></span><span class="ri-right">${evValue(e)}${e.delta != null ? dp(e.delta, e.field === 'sell' || e.field === 'rrp' || e.field === 'v7') : ''}</span></div>`;
  }
  h += `</div></section>`;
  const twins = rowsNow.filter((x) => x.style === base.style && x.key !== key);
  if (twins.length) h += `<section class="card"><header><h2>Stesso Style Code</h2></header><div class="list">${twins.map((t) => rowItem(t, qtyRight(t))).join('')}</div></section>`;
  h += '</div>';
  openSheet(base.style, () => { $('#sheetBody').innerHTML = h; });
}

/* ---------- vista: Report ---------- */
function renderRep() {
  let h = `<div class="view"><div class="lede"><h1>Report</h1><p>Carica il Condensed List ogni volta che vuoi controllare, anche più volte al giorno. Ogni report si confronta con i precedenti, che non vengono mai sovrascritti.</p></div>`;
  h += `<section class="card"><header><h2>Nuovo report</h2></header><div class="import">`;
  const p = S.pending;
  if (!p) {
    const clip = !window.claude && navigator.clipboard && navigator.clipboard.read;
    h += `<button class="btn primary" data-pick>Carica Condensed List</button>
    <div class="or">oppure</div>
    <div class="paste" id="pasteZone" contenteditable="true" inputmode="none" role="textbox" aria-label="Incolla qui i file del report" spellcheck="false">Copia il file, poi <b>tieni premuto qui</b> e scegli <b>Incolla</b><br><span style="font-size:13px">Dal computer: Ctrl+V o trascina i file nella pagina</span></div>
    ${clip ? '<button class="btn" data-clip>Incolla dagli appunti</button>' : ''}
    <div class="infobox">Ogni giorno carica il file Excel <span class="mono">Br2086-Condensed_List</span>: contiene tessile, calzature e accessori. Puoi caricare qui anche un backup .json.</div>`;
  }
  else if (p.stage === 'parsing') h += `<span>Leggo ${esc(p.name)}…</span><div class="bar"><i style="width:30%"></i></div>`;
  else if (p.stage === 'error') h += `<div class="warnbox">${esc(p.msg)}</div><button class="btn" data-cancel>Chiudi</button>`;
  else if (p.stage === 'saving') h += `<span>Salvo nello storico…</span><div class="bar"><i style="width:${p.pct}%"></i></div>`;
  else if (p.stage === 'preview') {
    const r = p.res, m = r.meta, c = r.checks;
    h += `<div><div style="font-family:var(--f-display);font-size:24px">${esc(fSnap({ completed: m.completed }))}</div><div class="note" style="padding:0">Negozio ${esc(m.branch)} ${esc(m.branchName)} · ${esc(m.files.join(', '))}</div></div>
    <div class="checks">
      <span class="${c.complete ? 'ok' : 'ko'}">${c.complete ? '✓ Completo: tessile, calzature e accessori' : '✗ Mancano: ' + esc(c.missingParts.join(', '))}</span>
      <span>${fN(c.rows)} articoli · ${fN(c.qty)} pezzi · ${fE(c.value)}</span>
      ${m.ignored.length ? `<span class="note" style="padding:0">Ho usato il Condensed List e ignorato: ${esc(m.ignored.join(', '))}</span>` : ''}
    </div>`;
    if (r.warnings.length) h += `<div class="infobox">${r.warnings.slice(0, 5).map(esc).join('<br>')}${r.warnings.length > 5 ? `<br>…e altri ${r.warnings.length - 5}` : ''}</div>`;
    if (p.dup) h += `<div class="warnbox">Questo report (${fD(m.completed)} ore ${esc(m.completed.slice(11, 16))}) è già nello storico. Non lo salvo una seconda volta.</div><button class="btn" data-cancel>Chiudi</button>`;
    else {
      if (!c.complete) h += `<div class="warnbox">In questo file manca una parte del negozio: salvandolo, gli articoli mancanti risulterebbero usciti dal report.</div>`;
      if (p.same) h += `<div class="infobox">I dati sono identici all'ultimo report salvato: nel frattempo non è cambiato nulla. Salvarlo non aggiunge informazioni.</div>`;
      const ok = c.complete && !p.same;
      h += `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-save>${ok ? 'Salva nello storico' : 'Salva comunque'}</button><button class="btn" data-cancel>Annulla</button></div>`;
    }
  }
  h += `</div></section>`;
  const mode = { cloud: ['on', 'Storico salvato sul tuo account: lo ritrovi da ogni dispositivo.'], local: [Store.persisted ? 'on' : 'warn', Store.persisted ? 'Storico salvato su questo telefono, protetto dalla pulizia automatica. Esporta comunque un backup ogni settimana.' : 'Storico salvato su questo telefono. Esporta un backup ogni settimana: se cancelli i dati del browser lo perdi.'], memory: ['warn', 'Archivio non disponibile: i dati si perdono chiudendo la pagina.'] }[Store.mode];
  h += `<div class="status"><span class="dot ${mode[0]}"></span>${mode[1]}</div>`;
  const list = S.metas.filter((m) => m.source === 'xlsx').slice().reverse();
  h += `<section class="card"><header><h2>Storico</h2><span class="note" style="padding:0">${fN(list.length)} report</span></header><div class="list">`;
  if (!list.length) h += `<div class="empty">Ancora nessun report.</div>`;
  const first = S.metas.find((m) => m.branch === S.branch && m.source === 'xlsx');
  for (const m of list) {
    const sub = m.source === 'xlsx'
      ? `${esc(m.branch)} · ${fN(m.rows)} articoli · ${ef0.format(m.declaredValue || 0)} · ${m.checks && m.checks.complete ? '<span class="ok">completo</span>' : '<span class="ko">incompleto</span>'}`
      : `PDF · <span class="ko">non usato nello storico</span>: il PDF conta meno pezzi del reale`;
    h += `<div class="snap"><div><b>${esc(fSnap(m))}</b>${first && first.id === m.id ? ' <span class="tag rep">giorno 1</span>' : ''}<div class="sub">${sub}</div></div>
      <div class="acts">${S.confirmDel === m.id ? `<button class="btn danger" data-delok="${esc(m.id)}">Elimina</button><button class="btn" data-delno>No</button>` : `<button class="btn ghost" data-del="${esc(m.id)}" aria-label="Elimina report">Elimina</button>`}</div></div>`;
  }
  h += `</div></section>`;
  h += `<section class="card"><header><h2>Soglie</h2></header><div class="filters">
    <div class="row2"><div class="field"><label for="sLow">Stock basso fino a (pz)</label><input id="sLow" inputmode="numeric" value="${settings.low}"></div>
    <div class="field"><label for="sOld">Ultima vendita vecchia oltre (giorni)</label><input id="sOld" inputmode="numeric" value="${settings.oldDays}"></div></div>
    <div class="row2"><div class="field"><label for="sBig">Cambio significativo da (pz)</label><input id="sBig" inputmode="numeric" value="${settings.bigAbs}"></div>
    <div class="field"><label for="sPct">…oppure da (%)</label><input id="sPct" inputmode="numeric" value="${settings.bigPct}"></div></div>
  </div></section>`;
  h += `<section class="card"><header><h2>Backup</h2></header><div class="import"><p style="margin:0" class="note">Un file con tutti i report salvati. Salvalo su Drive, iCloud o inviatelo per email: per ripristinarlo, caricalo con il pulsante "Carica Condensed List".</p><button class="btn" data-backup ${S.metas.length ? '' : 'disabled'}>Esporta backup</button></div></section>`;
  h += `<section class="card"><header><h2>Come leggere i dati</h2></header><div class="import" style="font-size:13px;gap:8px">
    <div>${tagR} Qty, prezzi, RRP, Price Type, ultima vendita, vendite 7gg e ubicazione sono letti dal Condensed List così come sono.</div>
    <div>${tagC} Differenze, stock iniziale, sconti e stime vendite sono calcolati confrontando i report salvati.</div>
    <div>TK = promo · NT = variazione di prezzo non promo, anche in aumento sopra l'RRP · FULL = prezzo pieno.</div>
    <div>Il report elenca solo articoli con stock: chi esce dal report può essere esaurito, trasferito o esposto.</div>
    <div>Un articolo con due linee prezzo nello stesso reparto è mostrato come una riga sola, con i pezzi sommati.</div>
    <div>Con più report nello stesso giorno, nella scheda Oggi puoi confrontare con il report precedente o con l'ultimo di ieri. La stima vendite conta un movimento quando la data di ultima vendita avanza o le vendite 7gg aumentano.</div>
  </div></section>`;
  return h + '</div>';
}

/* ---------- import ---------- */

let xlsxReady = null;
function loadXlsx() {
  if (xlsxReady) return xlsxReady;
  xlsxReady = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'lib/xlsx.full.min.js';
    s.onload = () => (window.XLSX ? res(window.XLSX) : rej(new Error('Lettore Excel non disponibile.')));
    s.onerror = () => { xlsxReady = null; rej(new Error('Non riesco a caricare il lettore Excel. Controlla la connessione e riprova.')); };
    document.head.appendChild(s);
  });
  return xlsxReady;
}
const handleFile = (f) => handleFiles([f]);
async function handleFiles(list) {
  const files = Array.from(list || []).filter(Boolean);
  if (!files.length) return;
  if (S.tab !== 'rep') setTab('rep');
  S.pending = { stage: 'parsing', name: files.map((f) => f.name || 'file incollato').join(', '), page: 0, pages: 0 }; render();
  try {
    const items = [];
    for (const f of files) {
      const data = new Uint8Array(await f.arrayBuffer());
      const head = String.fromCharCode(...data.slice(0, 1024));
      if (head.trimStart().startsWith('{')) items.push({ type: 'json', f });
      else if (head.includes('%PDF')) throw new Error('Questo è un PDF: l\'app ora usa solo il Condensed List in Excel.');
      else if (head.startsWith('PK') || head.startsWith('\xD0\xCF')) items.push({ type: 'xlsx', f, data });
      else throw new Error(`${f.name || 'Il file incollato'} non è un Excel né un PDF del report. Copia il file (non il testo o uno screenshot) e riprova.`);
    }
    const json = items.find((k) => k.type === 'json');
    if (json) { S.pending = null; return restoreBackup(json.f); }
    const xs = items.filter((k) => k.type === 'xlsx');
    if (!xs.length) throw new Error('Carica il file Excel Condensed_List del giorno. I PDF non vengono più usati.');
    const lib = await loadXlsx();
    const sheets = xs.map((k) => {
      const name = k.f.name || 'Excel incollato';
      try { return XP.parseSheet(XP.sheetRows(lib, lib.read(k.data, { type: 'array' })), name); } catch (e) { return { error: `${name}: file non leggibile.` }; }
    });
    const cond = sheets.find((x) => !x.error && x.kind === 'condensed');
    if (!cond) throw new Error(sheets.find((x) => x.error) ? sheets.find((x) => x.error).error : 'Questo non è il Condensed List. Carica il file Br2086-Condensed_List, che contiene tessile, calzature e accessori.');
    const res = XP.combine([cond], null);
    res.meta.ignored = sheets.filter((x) => x !== cond).map((x) => x.filename || 'file');
    if (res.error) throw new Error(res.error);
    if (!res.meta.completed) throw new Error('Non trovo la data del report nella prima riga dell\'Excel (Date:…).');
    res.meta.id = `${res.meta.completed}_xlsx`.replace(/[^A-Za-z0-9_\-.~:@+]/g, '-');
    const dup = S.metas.find((m) => m.id === res.meta.id) || null;
    let same = false;
    const last = S.model && S.model.snaps.length ? S.model.snaps[S.model.snaps.length - 1] : null;
    if (last && !dup && last.meta.branch === res.meta.branch) {
      same = res.rows.length === last.map.size && res.rows.every((r) => { const q = last.map.get(r.key); return q && q.qty === r.qty && q.sell === r.sell && q.u7 === r.u7 && q.last === r.last && q.ptype === r.ptype; });
    }
    S.pending = { stage: 'preview', res, dup, same };
  } catch (e) {
    S.pending = { stage: 'error', msg: e.message || 'Errore nella lettura del file.' };
  }
  render();
}

async function savePending() {
  const res = S.pending.res;
  const m = res.meta;
  const meta = { id: m.id, source: 'xlsx', kind: m.kind, completed: m.completed, branch: m.branch, branchName: m.branchName, files: m.files, declaredStyles: res.checks.rows, declaredValue: res.checks.value, checks: res.checks, warnings: res.warnings.slice(0, 20) };
  S.pending = { stage: 'saving', pct: 5 }; render();
  try {
    await Store.save(meta, res.rows.map(E.pack), (i, n) => { S.pending.pct = Math.round(100 * i / n); render(); });
    S.pending = null; S.branch = m.branch;
    await loadAll();
    S.idx = S.model.snaps.findIndex((s) => s.meta.id === m.id);
    renderSnapSel();
    toast(`Report del ${fD(m.completed)} salvato nello storico`);
    setTab('dash');
  } catch (e) {
    S.pending = { stage: 'error', msg: e && e.code === 'quota_exceeded' ? 'Spazio di archiviazione pieno: elimina qualche report vecchio dopo averne esportato il backup.' : 'Salvataggio non riuscito: ' + (e.message || e.code || 'errore sconosciuto') + '. Riprova.' };
    render();
  }
}

async function exportBackup() {
  try {
    const snaps = [];
    for (const m of S.metas) snaps.push({ meta: m, rows: await Store.loadRows(m) });
    const today = new Date().toISOString().slice(0, 10);
    const name = `storico-stock-${today}.json`;
    const blob = new Blob([JSON.stringify({ app: 'stock-not-on-display', version: 1, cols: E.COLS, snaps })], { type: 'application/json' });
    const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup storico stock' });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Backup scaricato: ' + name);
  } catch (e) { if (e && e.name !== 'AbortError') toast('Backup non riuscito: ' + (e.message || 'errore')); }
}

async function restoreBackup(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || j.app !== 'stock-not-on-display' || !Array.isArray(j.snaps)) throw new Error('Il file non è un backup di questa app.');
    let added = 0;
    for (const s of j.snaps) {
      if (!s.meta || !s.meta.id || S.metas.some((m) => m.id === s.meta.id)) continue;
      const { parts, rows, cols, importedAt, ...meta } = s.meta;
      await Store.save(meta, s.rows); added++;
    }
    await loadAll();
    toast(added ? `Ripristinati ${added} report` : 'Tutti i report del backup erano già presenti');
    render();
  } catch (e) { S.pending = { stage: 'error', msg: e.message || 'Backup non leggibile.' }; render(); }
}

/* ---------- foglio ---------- */
let sheetMore = null;
const sheetStack = [];
function openSheet(title, draw) {
  if (!$('#sheet').hidden && sheetStack.length) sheetStack[sheetStack.length - 1].scroll = $('#sheetBody').scrollTop;
  else sheetStack.length = 0;
  sheetStack.push({ title, draw, more: null });
  showTop(0);
}
function showTop(scroll) {
  const top = sheetStack[sheetStack.length - 1];
  $('#sheetTitle').textContent = top.title; sheetMore = null; top.draw();
  if (sheetMore) top.more = sheetMore; else sheetMore = top.more;
  $('#sheet').hidden = false; $('#sheetBody').scrollTop = scroll || 0;
}
function closeSheet() { $('#sheet').hidden = true; sheetStack.length = 0; }
function backSheet() { sheetStack.pop(); if (!sheetStack.length) return closeSheet(); showTop(sheetStack[sheetStack.length - 1].scroll); }

/* ---------- render e interazioni ---------- */
function render() {
  const main = $('#main');
  const st = main.scrollTop;
  const views = { dash: renderDash, var: renderVar, art: renderArt, rep: renderRep };
  main.innerHTML = views[S.tab]();
  main.scrollTop = st;
}
function setTab(t) {
  S.tab = t;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === t ? 'page' : 'false'));
  render(); $('#main').scrollTop = 0;
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, [data-open]');
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.open) return openItem(d.open);
  if (d.dash) { const [s, l] = d.dash.split(':'); S.dashSel[s] = l; return render(); }
  if (d.cmp) { cmpMode = d.cmp; try { localStorage.setItem('nod-cmp', cmpMode); } catch (e) {} return render(); }
  if (d.all) { const [s, l] = d.all.split(':'); return openAll(s, l); }
  if (d.sheetmore !== undefined) return sheetMore && sheetMore();
  if (d.clip !== undefined) return readClipboard();
  if (d.pick !== undefined) { $('#fileIn').value = ''; return $('#fileIn').click(); }
  if (d.cancel !== undefined) { S.pending = null; return render(); }
  if (d.save !== undefined) return savePending();
  if (d.del) { S.confirmDel = d.del; return render(); }
  if (d.delno !== undefined) { S.confirmDel = null; return render(); }
  if (d.delok) {
    const m = S.metas.find((x) => x.id === d.delok);
    S.confirmDel = null;
    if (m) Store.remove(m).then(() => loadAll()).then(() => { toast(`Report del ${fD(m.completed)} eliminato`); render(); }).catch((e) => toast('Eliminazione non riuscita: ' + (e.message || e.code)));
    return;
  }
  if (d.backup !== undefined) return exportBackup();
  if (d.evt) { S.ev.types.has(d.evt) ? S.ev.types.delete(d.evt) : S.ev.types.add(d.evt); S.ev.limit = 200; return render(); }
  if (d.artmore !== undefined && $('#artBody')) { S.art.limit += 60; $('#artBody').innerHTML = artBody(); return; }
  if (d.evall) {
    S.ev.types = d.evall === '1' ? new Set(Object.keys(E.EVENT_TYPES)) : d.evall === '0' ? new Set() : new Set(['qty_su', 'qty_giu', 'zero', 'scomparso', 'nuovo', 'tornato', 'promo', 'varprezzo', 'full', 'ptype', 'prezzo']);
    return render();
  }
  if (d.evmore !== undefined) { S.ev.limit += 200; return render(); }
  if (d.artmore !== undefined) { S.art.limit += 60; return render(); }
  if (d.togglefilters !== undefined) { S.art.showFilters = !S.art.showFilters; return render(); }
  if (d.clearfilters !== undefined) { Object.assign(S.art, { ptype: '', qmin: '', qmax: '', u7min: '', lastOld: '', loc: '', onlyNew: false }); return render(); }
  if (d.clearmain !== undefined) { Object.assign(S.art, { dept: '', cat: '', brand: '' }); return render(); }
});

let inputT = null;
document.addEventListener('input', (ev) => {
  const id = ev.target.id;
  const v = ev.target.value;
  const later = (fn) => { clearTimeout(inputT); inputT = setTimeout(fn, 220); };
  if (id === 'artQ') return later(() => { S.art.q = v; S.art.limit = 60; const b = $('#artBody'); if (b) b.innerHTML = artBody(); });
  if (id === 'evQ') return later(() => { S.ev.q = v; S.ev.limit = 200; const b = $('#evBody'); if (b) b.innerHTML = evBody(); });
  const setMap = { sLow: 'low', sOld: 'oldDays', sBig: 'bigAbs', sPct: 'bigPct' };
  if (setMap[id]) { const n = parseInt(v, 10); if (n >= 0) { settings[setMap[id]] = n; saveSettings(); } }
});
document.addEventListener('change', (ev) => {
  const id = ev.target.id, v = ev.target.value;
  if (id === 'snapSel') { S.idx = +v; S.ev.to = null; S.ev.from = null; closeSheet(); return render(); }
  if (id === 'branchSel') { S.branch = v; return loadAll().then(render); }
  if (id === 'fileIn') return handleFiles(ev.target.files);
  if (id === 'evFrom') { S.ev.from = +v; return render(); }
  if (id === 'evTo') { S.ev.to = +v; if (S.ev.from >= S.ev.to) S.ev.from = S.ev.to - 1; return render(); }
  if (id === 'artSort') { S.art.sort = v; return render(); }
  const selMap = { fBrand: 'brand', fDept: 'dept', fCat: 'cat', fPtype: 'ptype', fLast: 'lastOld' };
  if (selMap[id]) { S.art[selMap[id]] = v; S.art.limit = 60; return render(); }
  if (id === 'fNew') { S.art.onlyNew = v === '1'; return render(); }
  const numMap = { fQmin: 'qmin', fQmax: 'qmax', fU7: 'u7min' };
  if (numMap[id]) { S.art[numMap[id]] = v.replace(/[^0-9]/g, ''); S.art.limit = 60; return render(); }
  if (id === 'fLoc') { S.art.loc = v.trim(); S.art.limit = 60; return render(); }
  if (['sLow', 'sOld', 'sBig', 'sPct'].includes(id)) { sumCache.k = null; toast('Soglie aggiornate'); }
});
const filesFrom = (list) => Array.from(list || []).filter(Boolean);
document.addEventListener('paste', (e) => {
  const cd = e.clipboardData;
  let fs = cd ? filesFrom(cd.files) : [];
  if (!fs.length && cd && cd.items) for (const it of cd.items) { if (it.kind === 'file') { const x = it.getAsFile(); if (x) fs.push(x); } }
  const inZone = e.target && e.target.closest && e.target.closest('#pasteZone');
  if (fs.length) { e.preventDefault(); if (document.activeElement) document.activeElement.blur(); handleFiles(fs); return; }
  if (inZone) { e.preventDefault(); toast('Negli appunti non c\'è un file. Copia il file del report, non il suo testo, e riprova.'); }
});
document.addEventListener('beforeinput', (e) => { if (e.target && e.target.id === 'pasteZone' && e.inputType !== 'insertFromPaste') e.preventDefault(); });
document.addEventListener('dragover', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { e.preventDefault(); const z = $('#pasteZone'); if (z) z.classList.add('over'); } });
document.addEventListener('dragleave', () => { const z = $('#pasteZone'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', (e) => {
  const fs = e.dataTransfer ? filesFrom(e.dataTransfer.files) : [];
  if (!fs.length) return;
  e.preventDefault(); handleFiles(fs);
});
async function readClipboard() {
  try {
    const items = await navigator.clipboard.read();
    for (const it of items) {
      const t = it.types.find((x) => /sheet|excel/i.test(x)) || it.types.find((x) => /pdf/i.test(x)) || it.types.find((x) => /json/i.test(x));
      if (t) { const b = await it.getType(t); const ext = /json/i.test(t) ? 'json' : /pdf/i.test(t) ? 'pdf' : 'xlsx'; return handleFiles([new File([b], 'appunti.' + ext, { type: t })]); }
    }
    toast('Negli appunti non trovo il file del report. Prova a tenere premuto il riquadro e scegliere Incolla.');
  } catch (e) {
    toast('Il telefono non permette di leggere gli appunti da qui. Tieni premuto il riquadro e scegli Incolla.');
  }
}
$('#sheetBack').addEventListener('click', backSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) backSheet(); });


/* ---------- avvio ---------- */
(async function boot() {
  try {
    await Store.init();
    $('#bootMsg').textContent = Store.mode === 'cloud' ? 'Carico lo storico dal tuo account…' : 'Carico lo storico…';
    await loadAll();
  } catch (e) {
    toast('Non riesco a leggere lo storico: ' + (e.message || e.code || 'errore') + '. Riapri la pagina.');
  }
  render();
})();
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
